<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./zanax-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>ZANAX | Security Lab</title>
    <script type="module" crossorigin src="./assets/index-B-m86jWw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dx6rJHWS.css">
  </head>
  <body>
    <script>
      (() => {
        const replaceBrand = (value) =>
          typeof value === "string" ? value.replace(/strix/gi, "ZANAX") : value;

        const brandElement = (el) => {
          if (!(el instanceof Element)) return;

          for (const attr of ["title", "aria-label", "alt"]) {
            const value = el.getAttribute(attr);
            if (value && /strix/i.test(value)) {
              el.setAttribute(attr, replaceBrand(value));
            }
          }

          if (el.matches('a[href*="strix.ai"]')) {
            el.setAttribute("href", "/");
            el.removeAttribute("target");
          }

          if (el.matches('img[src*="logo.png"], img[alt*="Strix" i]')) {
            el.setAttribute("src", "./zanax-mark.svg");
            el.setAttribute("alt", "ZANAX");
            el.classList.add("object-contain");
          }
        };

        const brandNode = (node) => {
          if (node.nodeType === Node.TEXT_NODE) {
            const parent = node.parentElement;
            if (
              parent &&
              !parent.closest("script,style,pre,code,textarea") &&
              /strix/i.test(node.nodeValue || "")
            ) {
              node.nodeValue = replaceBrand(node.nodeValue);
            }
            return;
          }

          if (!(node instanceof Element)) return;
          brandElement(node);

          if (node.matches("script,style,pre,code,textarea")) return;

          const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
          let textNode;
          while ((textNode = walker.nextNode())) {
            const parent = textNode.parentElement;
            if (
              parent &&
              !parent.closest("script,style,pre,code,textarea") &&
              /strix/i.test(textNode.nodeValue || "")
            ) {
              textNode.nodeValue = replaceBrand(textNode.nodeValue);
            }
          }

          node.querySelectorAll("*").forEach(brandElement);
        };

        document.title = "ZANAX | Security Lab";
        brandNode(document.body);

        // Process only newly inserted DOM. A full-document scan on every React
        // update caused unnecessary work and could make the viewer unresponsive.
        const observer = new MutationObserver((records) => {
          for (const record of records) {
            for (const addedNode of record.addedNodes) brandNode(addedNode);
          }
        });
        observer.observe(document.getElementById("root") || document.body, {
          childList: true,
          subtree: true
        });
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
