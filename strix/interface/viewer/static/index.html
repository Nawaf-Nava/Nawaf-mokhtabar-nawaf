<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./zanax-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>ZANAX | Security Lab</title>
    <script type="module" crossorigin src="./assets/index-B-m86jWw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dx6rJHWS.css">
  </head>
  <body>
    <script>
      (() => {
        const brand = () => {
          document.title = "ZANAX | Security Lab";
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement && node.parentElement.closest("script,style,pre,code,textarea")) continue;
            if (/strix/i.test(node.nodeValue || "")) node.nodeValue = node.nodeValue.replace(/strix/gi, "ZANAX");
          }
          document.querySelectorAll("*").forEach((el) => {
            for (const attr of ["title", "aria-label", "alt"]) {
              const value = el.getAttribute && el.getAttribute(attr);
              if (value && /strix/i.test(value)) el.setAttribute(attr, value.replace(/strix/gi, "ZANAX"));
            }
          });
          document.querySelectorAll('a[href*="strix.ai"]').forEach((a) => { a.href = "/"; a.removeAttribute("target"); });
          document.querySelectorAll('img[src*="logo.png"], img[alt*="Strix"]').forEach((img) => {
            img.src = "./zanax-mark.svg"; img.alt = "ZANAX"; img.classList.add("object-contain");
          });
        };
        new MutationObserver(brand).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
        brand();
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
