services:
  - type: web
    name: nawaf-mokhtabar-nawaf
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: STRIX_RUNS_DIR
        value: /tmp/strix_runs
      - key: STRIX_VIEWER_USERNAME
        sync: false
      - key: STRIX_VIEWER_PASSWORD
        sync: false
      - key: STRIX_WORKER_TOKEN
        generateValue: true
